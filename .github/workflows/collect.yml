name: collect

# Щогодини. GitHub виконує заплановані задачі "коли зможе", тому реальний
# інтервал плаває. Для запису це прийнятно: ми фіксуємо спостереження з міткою
# часу, а не рівномірну сітку.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Збір
        run: python collect.py --incremental

      - name: Коміт, якщо є зміни
        run: |
          git config user.name  "atlassian-status bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incidents.jsonl changes.jsonl hosts.json
          # Тиша — нормальний стан: більшість годин Atlassian нічого не змінює.
          # Тому порожній діф не є помилкою, на відміну від app-uptime.
          if git diff --staged --quiet; then
            echo "без змін"
            exit 0
          fi
          # Повідомлення коміта несе кількість правок — щоб історія читалась
          # без відкривання дифів.
          EDITS=$(git diff --staged --numstat -- changes.jsonl | awk '{print $1}')
          git commit -m "collect $(date -u +'%Y-%m-%dT%H:%MZ')${EDITS:+ · ${EDITS} edits}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::не вдалося запушити після 3 спроб"; exit 1
